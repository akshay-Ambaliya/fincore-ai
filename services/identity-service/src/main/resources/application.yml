server:
  port: 8082

spring:
  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  application:
    name: identity-service

  datasource:
    url: ${IDENTITY_DB_URL:jdbc:postgresql://localhost:5433/identity_db}
    username: ${IDENTITY_DB_USERNAME:identity_user}
    password: ${IDENTITY_DB_PASSWORD:identity_local_dev}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration


management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

app:
  verification:
    base-url: http://localhost:8082/api/auth/verify-email