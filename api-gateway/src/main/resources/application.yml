
server:
  port: 8081

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/auth/**

            - id: identity-health
              uri: http://localhost:8082
              predicates:
                - Path=/identity/actuator/**
              filters:
                - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always
